name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # 24.04 ships with the Android SDK preinstalled (ANDROID_HOME is set).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            # surface the important lines as annotations so they are easy to read
            grep -E "error:|e: |What went wrong|Could not|failed|Exception" build.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk drift.apk && ls -l drift.apk

      - uses: actions/upload-artifact@v4
        with:
          name: drift-apk
          path: drift.apk

      # Publishes the APK as a release so you can download it straight from your phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: drift.apk
          make_latest: true
