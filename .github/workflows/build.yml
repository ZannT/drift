name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/*.apk drift.apk

      - uses: actions/upload-artifact@v4
        with:
          name: drift-apk
          path: drift.apk

      # Publishes the APK as a release so you can download it straight from your phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: drift.apk
          make_latest: true
